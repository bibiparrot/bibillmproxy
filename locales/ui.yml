  ko: "환경 변수 키는 os.environ/NAME을 사용합니다. 일반 텍스트 키는 YAML에 저장되므로 파일을 보호하세요."
  ru: "Для переменной среды используйте os.environ/NAME. Ключ в открытом виде сохраняется в YAML."
